<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#A8C8B5"><meta name="description" content="Casa en Calma · Organiza · Comparte · Disfruta"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Casa en Calma"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" href="assets/icon-192.png"><title>Casa en Calma</title>
<style>
:root{--bg:#fff8f5;--card:#fff;--ink:#30433a;--muted:#718078;--green:#a8c8b5;--green2:#7eae91;--cream:#f6eadf;--peach:#f5cdbd;--yellow:#f5df9b;--line:#e7ddd6;--danger:#d77b70;--shadow:0 8px 28px #5a453012}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8f5,#f7f1ec);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:14px 14px 8px;position:sticky;top:0;background:#fff8f5ee;backdrop-filter:blur(12px);z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;border-radius:16px;box-shadow:var(--shadow)}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.weather{margin-top:10px;background:var(--green);border-radius:18px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--shadow)}.weather small{display:block;color:#385243}.main{padding:7px 13px}.view{display:none}.view.active{display:block}.hero{background:var(--card);padding:17px;border-radius:24px;box-shadow:var(--shadow);margin:9px 0}.hero h2{margin:0 0 5px;font-size:24px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 4px 16px #5a453008}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.stack>*+*{margin-top:9px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--cream);font-size:12px}.priority{background:#fde1db}.done{opacity:.58;text-decoration:line-through}.task{display:flex;gap:10px;align-items:flex-start}.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--green2);background:white;flex:0 0 auto}.check.on{background:var(--green2);position:relative}.check.on:after{content:'✓';color:#fff;position:absolute;left:4px;top:0;font-weight:700}.avatar{width:38px;height:38px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:21px;flex:0 0 auto}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#fffdfbf2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{background:transparent;color:var(--muted);padding:5px 2px;border-radius:12px;font-size:11px}.nav button.active{background:var(--green);color:var(--ink)}.nav b{display:block;font-size:19px}.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:82px;width:54px;height:54px;border-radius:50%;background:var(--green2);color:#fff;font-size:28px;box-shadow:var(--shadow);z-index:8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--green);padding:9px 12px;border-radius:13px;color:var(--ink)}.btn.secondary{background:var(--cream)}.btn.danger{background:#f2c7c0}.btn.small{padding:7px 9px;font-size:13px}.list{display:grid;gap:9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px;gap:8px}.section-title h2,.section-title h3{margin:0}.form{display:grid;gap:9px}.form input,.form select,.form textarea,.inline-input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:13px;background:#fff}.modal{position:fixed;inset:0;background:#24362d66;display:none;align-items:end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{background:#fffaf7;width:min(760px,100%);max-height:91vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px}.close{float:right;background:var(--cream);border-radius:50%;width:34px;height:34px}.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.avpick{padding:10px;border-radius:16px;background:#faf3ee;border:2px solid transparent;font-size:27px}.avpick.sel{border-color:var(--green2);background:#e8f3ec}.notice{padding:10px 12px;border-radius:13px;background:#fff1c7}.empty{text-align:center;padding:22px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;text-align:left;box-shadow:0 4px 16px #5a453008;color:var(--ink)}.quick b{display:block;font-size:21px}.mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.meal{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.meal label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.weather-detail{display:none;margin-top:8px;background:#fffaf7;border:1px solid var(--line);border-radius:15px;padding:10px}.weather-detail.show{display:block}.badge-ok{background:#e4f2e8}.badge-warn{background:#fff1c7}.tableish{display:grid;gap:7px}.subtle{font-size:12px;color:var(--muted)}.checkrow{display:flex;align-items:center;gap:8px}.checkrow input{width:auto}.more-sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.more-sheet button{text-align:left;padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff}.more-sheet b{display:block;font-size:20px;margin-bottom:3px}@media(max-width:390px){.grid,.quick{grid-template-columns:1fr 1fr}.quick button{padding:10px}.mealgrid{grid-template-columns:1fr}}@media(min-width:650px){.nav{bottom:12px;border:1px solid var(--line);border-radius:22px;width:730px}.app{padding-bottom:110px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><img src="assets/logo-casa-en-calma.png" alt="Casa en Calma"><div><h1>Casa en Calma</h1><p>Organiza · Comparte · Disfruta · V4</p></div></div><div id="weather" class="weather"><div><span id="weatherIcon">🌤️</span> <b id="temp">Tiempo</b><small id="weatherText">Configura tu ubicación</small></div><button class="btn secondary small" onclick="toggleWeatherDetails()">Detalles</button></div><div id="weatherDetail" class="weather-detail"></div></header>
<main class="main"><section id="today" class="view active"></section><section id="tasks" class="view"></section><section id="calendar" class="view"></section><section id="family" class="view"></section><section id="menu" class="view"></section><section id="shop" class="view"></section><section id="house" class="view"></section><section id="mind" class="view"></section><section id="settings" class="view"></section></main>
<button class="fab" onclick="openTask()" aria-label="Nueva tarea">+</button>
<nav class="nav"><button data-view="today" onclick="go('today')"><b>🏠</b>Hoy</button><button data-view="tasks" onclick="go('tasks')"><b>✓</b>Tareas</button><button data-view="family" onclick="go('family')"><b>👨‍👩‍👧</b>Familia</button><button data-view="menu" onclick="go('menu')"><b>🍲</b>Menú</button><button onclick="openMore()"><b>☰</b>Más</button></nav></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const KEY='casa-calma-v4';
const defaultDB={family:{name:'Nuestra casa',code:'',members:[{id:'me',name:'Yo',avatar:'🌿'}]},tasks:[],events:[],menu:{},shopping:[],inventory:[],notes:[],routines:[],weather:{city:'',lat:null,lon:null,data:null},settings:{notify:true,people:4,diet:'Sin dieta especial',fav:'',no:'',time:'30 min',budget:'',mealsPerDay:2,repeat:'media'}};
let db=loadDB();
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');return mergeDB(d||clone(defaultDB))}catch{return clone(defaultDB)}}
function mergeDB(d){let b=clone(defaultDB);for(const k of Object.keys(b))if(d&&d[k]!==undefined)b[k]=d[k];b.family=b.family||clone(defaultDB.family);b.family.members=Array.isArray(b.family.members)&&b.family.members.length?b.family.members:clone(defaultDB.family.members);b.tasks=Array.isArray(b.tasks)?b.tasks:[];b.events=Array.isArray(b.events)?b.events:[];b.shopping=Array.isArray(b.shopping)?b.shopping:[];b.inventory=Array.isArray(b.inventory)?b.inventory:[];b.notes=Array.isArray(b.notes)?b.notes:[];b.routines=Array.isArray(b.routines)?b.routines:[];b.menu=b.menu&&typeof b.menu==='object'?b.menu:{};b.settings={...clone(defaultDB.settings),...(b.settings||{})};b.weather={...clone(defaultDB.weather),...(b.weather||{})};return b}
function save(localOnly=false){localStorage.setItem(KEY,JSON.stringify(db));render();if(!localOnly)syncDebounced()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)} function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)} function member(id){return db.family.members.find(x=>x.id===id)||db.family.members[0]||{name:'Sin asignar',avatar:'👤'}}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));renderView(v);window.scrollTo({top:0,behavior:'smooth'})}
function render(){const v=document.querySelector('.view.active')?.id||'today';renderView(v);updateWeatherUI();}
function renderView(v){({today:renderToday,tasks:renderTasks,calendar:renderCalendar,family:renderFamily,menu:renderMenu,shop:renderShop,house:renderHouse,mind:renderMind,settings:renderSettings}[v]||renderToday)()}
function taskHTML(t){return `<div class="card task ${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="toggleTask('${t.id}')"></button><div style="flex:1"><div><b>${esc(t.title)}</b> ${t.priority==='alta'?'<span class="pill priority">Alta</span>':''}</div><div class="muted">${esc(t.area||'Casa')} · ${esc(member(t.assignee).avatar)} ${esc(member(t.assignee).name)}${t.time?' · '+esc(t.time):''}${t.repeat&&t.repeat!=='none'?' · '+repeatLabel(t.repeat):''}</div>${t.notes?`<small>${esc(t.notes)}</small>`:''}</div><button class="btn secondary small" onclick="editTask('${t.id}')">✎</button></div>`}
function repeatLabel(r){return ({daily:'Diaria',weekdays:'L-V',weekly:'Semanal'})[r]||''}
function renderToday(){const ts=db.tasks.filter(t=>t.date===today()||(!t.date&&t.repeat==='daily')||(t.repeat==='weekdays'&&[1,2,3,4,5].includes(new Date().getDay())));const done=ts.filter(t=>t.done).length;const k=today();const m=db.menu[k]||{};const pending=db.shopping.filter(x=>!x.done).length;document.getElementById('today').innerHTML=`<div class="hero"><div class="row"><div><h2>Buenos días 🌿</h2><div class="muted">La casa, de un vistazo.</div></div><span class="pill">${done}/${ts.length} tareas</span></div></div><div class="quick"><button onclick="go('tasks')"><b>✓</b>Tareas<div class="muted">${ts.length-done} pendientes</div></button><button onclick="go('menu')"><b>🍲</b>Menú<div class="muted">${m.lunch||'Comida sin plan'}</div></button><button onclick="go('shop')"><b>🛒</b>Compra<div class="muted">${pending} pendientes</div></button><button onclick="go('family')"><b>👨‍👩‍👧</b>Familia<div class="muted">${db.family.members.length} miembros</div></button><button onclick="go('house')"><b>🏡</b>Casa<div class="muted">Inventario y rutinas</div></button><button onclick="go('mind')"><b>🧠</b>Vacía la cabeza<div class="muted">Apunta y organiza</div></button></div><div class="section-title"><h3>Hoy</h3><button class="btn secondary small" onclick="openTask()">＋ Tarea</button></div><div class="card"><b>🍲 Comida:</b> ${esc(m.lunch||'Sin plan')}<br><b>🌙 Cena:</b> ${esc(m.dinner||'Sin plan')}</div><div class="section-title"><h3>Lo importante</h3><button class="btn secondary small" onclick="go('tasks')">Ver todo</button></div><div class="list">${ts.slice(0,8).map(taskHTML).join('')||'<div class="card empty">No hay tareas para hoy 🎉</div>'}</div>`}
function renderTasks(){document.getElementById('tasks').innerHTML=`<div class="section-title"><h2>Tareas</h2><button class="btn" onclick="openTask()">＋ Tarea</button></div><div class="actions"><button class="btn secondary small" onclick="filterTasks('today')">Hoy</button><button class="btn secondary small" onclick="filterTasks('all')">Todas</button><button class="btn secondary small" onclick="filterTasks('open')">Pendientes</button></div><div id="tasklist" class="list" style="margin-top:10px">${db.tasks.length?db.tasks.map(taskHTML).join(''):'<div class="card empty">Añade tu primera tarea.</div>'}</div>`}
function filterTasks(f){let a=f==='today'?db.tasks.filter(t=>t.date===today()):f==='open'?db.tasks.filter(t=>!t.done):db.tasks;document.getElementById('tasklist').innerHTML=a.map(taskHTML).join('')||'<div class="card empty">Nada por aquí 🎉</div>'}
function openTask(id=''){const t=db.tasks.find(x=>x.id===id)||{id:'',title:'',date:today(),time:'',area:'Casa',assignee:db.family.members[0]?.id,priority:'normal',repeat:'none',notes:''};modal(`<h2>${id?'Editar':'Nueva'} tarea</h2><div class="form"><input id="fTitle" placeholder="Qué hay que hacer" value="${esc(t.title)}"><input id="fDate" type="date" value="${t.date||today()}"><input id="fTime" type="time" value="${t.time||''}"><input id="fArea" placeholder="Área" value="${esc(t.area||'Casa')}"><select id="fAssignee">${db.family.members.map(m=>`<option value="${esc(m.id)}" ${m.id===t.assignee?'selected':''}>${m.avatar} ${esc(m.name)}</option>`).join('')}</select><select id="fPriority"><option value="normal" ${t.priority==='normal'?'selected':''}>Prioridad normal</option><option value="alta" ${t.priority==='alta'?'selected':''}>🔴 Prioridad alta</option></select><select id="fRepeat"><option value="none">Sin repetición</option><option value="daily" ${t.repeat==='daily'?'selected':''}>Cada día</option><option value="weekdays" ${t.repeat==='weekdays'?'selected':''}>Lunes a viernes</option><option value="weekly" ${t.repeat==='weekly'?'selected':''}>Cada semana</option></select><textarea id="fNotes" placeholder="Notas">${esc(t.notes||'')}</textarea><button class="btn" onclick="saveTask('${t.id}')">Guardar tarea</button></div>`)}
function saveTask(id){const x={id:id||uid(),title:fTitle.value.trim(),date:fDate.value||today(),time:fTime.value,area:fArea.value.trim()||'Casa',assignee:fAssignee.value,priority:fPriority.value,repeat:fRepeat.value,notes:fNotes.value.trim(),done:false};if(!x.title)return alert('Escribe qué hay que hacer');const old=db.tasks.find(t=>t.id===id);if(old)x.done=old.done;if(old)Object.assign(old,x);else db.tasks.push(x);closeModal();save();notify('Tarea guardada',x.title)}
function editTask(id){openTask(id)} function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();if(t.done)notify('Tarea completada',t.title)}}
function renderCalendar(){const ev=[...db.events].sort((a,b)=>a.date.localeCompare(b.date)||String(a.time).localeCompare(String(b.time)));document.getElementById('calendar').innerHTML=`<div class="section-title"><h2>Agenda</h2><button class="btn" onclick="openEvent()">＋ Evento</button></div><div class="list">${ev.map(e=>`<div class="card"><div class="row"><b>${esc(e.title)}</b><span class="pill">${esc(e.date)}${e.time?' · '+esc(e.time):''}</span></div><div class="muted">${esc(e.notes||'')}</div></div>`).join('')||'<div class="card empty">No hay eventos.</div>'}</div>`}
function openEvent(id=''){const e=db.events.find(x=>x.id===id)||{id:'',title:'',date:today(),time:'',notes:''};modal(`<h2>${id?'Editar':'Nuevo'} evento</h2><div class="form"><input id="eTitle" placeholder="Título" value="${esc(e.title)}"><input id="eDate" type="date" value="${e.date}"><input id="eTime" type="time" value="${e.time}"><textarea id="eNotes" placeholder="Notas">${esc(e.notes)}</textarea><button class="btn" onclick="saveEvent('${e.id}')">Guardar evento</button></div>`)}
function saveEvent(id){const e={id:id||uid(),title:eTitle.value.trim(),date:eDate.value||today(),time:eTime.value,notes:eNotes.value};if(!e.title)return alert('Escribe un título');const old=db.events.find(x=>x.id===id);if(old)Object.assign(old,e);else db.events.push(e);closeModal();save();notify('Evento guardado',e.title)}
const avatars=['👩🏻','👨🏻','👩🏼','👨🏼','👧🏻','👦🏻','🧒🏻','👶🏻','👵🏻','👴🏻','🐶','🐱','🐰','🦊','🌈','⭐'];
function renderFamily(){document.getElementById('family').innerHTML=`<div class="section-title"><h2>Familia</h2><div class="actions"><button class="btn secondary small" onclick="joinFamily()">🔑 Unirse</button><button class="btn small" onclick="invite()">＋ Invitar</button></div></div><div class="card"><b>${esc(db.family.name)}</b><div class="muted">Código familiar: <b>${esc(db.family.code||'Aún no creado')}</b></div><div class="subtle" style="margin-top:5px">Los cambios se sincronizan entre teléfonos cuando la función de Netlify está desplegada.</div><div class="actions" style="margin-top:9px"><button class="btn secondary small" onclick="invite()">Compartir código</button><button class="btn secondary small" onclick="syncNow(true)">☁ Probar sincronización</button></div></div><div class="list" style="margin-top:10px">${db.family.members.map(m=>`<div class="card row"><div class="row" style="justify-content:flex-start"><div class="avatar">${m.avatar}</div><div><b>${esc(m.name)}</b><div class="muted">Miembro de la casa</div></div></div><button class="btn secondary small" onclick="editMember('${m.id}')">✎</button></div>`).join('')}</div>`}
function editMember(id){const m=member(id);modal(`<h2>Perfil familiar</h2><div class="form"><input id="mName" value="${esc(m.name)}" placeholder="Nombre"><div class="avatar-grid">${avatars.map(a=>`<button type="button" class="avpick ${a===m.avatar?'sel':''}" onclick="pickAvatar(this,'${a}')">${a}</button>`).join('')}</div><input type="hidden" id="mAvatar" value="${esc(m.avatar)}"><button class="btn" onclick="saveMember('${id}')">Guardar</button></div>`)}
function pickAvatar(el,a){document.querySelectorAll('.avpick').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');mAvatar.value=a} function saveMember(id){const m=member(id);m.name=mName.value.trim()||m.name;m.avatar=mAvatar.value;closeModal();save()}
function invite(){if(!db.family.code)db.family.code=Math.random().toString(36).slice(2,8).toUpperCase();save(true);modal(`<h2>Invitar a la familia</h2><div class="notice">Comparte este código solo con tu familia.</div><div class="hero" style="text-align:center;font-size:30px;letter-spacing:5px">${db.family.code}</div><div class="actions"><button class="btn" onclick="copyCode()">Copiar código</button><button class="btn secondary" onclick="shareCode()">Compartir</button></div><div class="muted" style="margin-top:10px">En el otro teléfono: Casa en Calma → Familia → Unirse.</div>`)}
async function copyCode(){try{await navigator.clipboard.writeText(db.family.code);alert('Código copiado')}catch{alert('Código: '+db.family.code)}} async function shareCode(){const text='Únete a nuestra casa en Casa en Calma. Código familiar: '+db.family.code;try{if(navigator.share)await navigator.share({title:'Casa en Calma',text});else await copyCode()}catch{}}
function joinFamily(){const c=prompt('Introduce el código familiar');if(!c)return;const code=c.replace(/[^a-z0-9]/gi,'').toUpperCase();if(code.length<4)return alert('Código no válido');db.family.code=code;save(true);syncNow(true)}
const recipes=[
{name:'Lentejas con verduras',lunch:['lentejas','zanahoria','cebolla','tomate'],dinner:['crema de verduras','pan'],time:45},
{name:'Pollo al horno con patatas',lunch:['pollo','patata','cebolla'],dinner:['ensalada','pollo'],time:45},
{name:'Pasta con tomate y atún',lunch:['pasta','tomate','atún'],dinner:['ensalada','pasta'],time:25},
{name:'Tortilla de patata + ensalada',lunch:['huevo','patata','cebolla','lechuga'],dinner:['tortilla','tomate'],time:35},
{name:'Arroz con verduras y huevo',lunch:['arroz','calabacín','zanahoria','huevo'],dinner:['crema de calabacín','pan'],time:30},
{name:'Crema de calabacín + pescado',lunch:['calabacín','patata','pescado'],dinner:['crema de calabacín','pescado'],time:30},
{name:'Pizza casera de verduras',lunch:['masa de pizza','tomate','queso','verduras'],dinner:['pizza','ensalada'],time:35},
{name:'Garbanzos salteados',lunch:['garbanzos','espinaca','huevo'],dinner:['sopa de verduras','pan'],time:25}
];
function renderMenu(){const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const monday=getMonday();document.getElementById('menu').innerHTML=`<div class="section-title"><h2>Menú semanal</h2><button class="btn" onclick="generateMenu()">✨ Crear menú</button></div><div class="card"><b>Planifica comida y cena</b><div class="muted">Puedes escribirlo tú, generar un menú según preferencias o usar lo que ya tienes en casa.</div><div class="actions" style="margin-top:9px"><button class="btn secondary" onclick="menuFromPantry()">🥕 Con lo que tengo</button><button class="btn secondary" onclick="openMenuPrefs()">⚙ Preferencias</button><button class="btn secondary" onclick="addMissingFromMenu()">🛒 Faltan ingredientes</button></div></div><div class="list" style="margin-top:10px">${days.map((d,i)=>{const dt=new Date(monday);dt.setDate(monday.getDate()+i);const k=localDate(dt);const m=db.menu[k]||{};return `<div class="card"><div class="row"><b>${d}</b><span class="pill">${k}</span></div><div class="mealgrid"><div class="meal"><label>🍲 COMIDA</label><input class="inline-input" value="${esc(m.lunch||'')}" placeholder="Comida" onchange="setMeal('${k}','lunch',this.value)"></div><div class="meal"><label>🌙 CENA</label><input class="inline-input" value="${esc(m.dinner||'')}" placeholder="Cena" onchange="setMeal('${k}','dinner',this.value)"></div></div></div>`}).join('')}</div>`}
function getMonday(){const d=new Date();const dow=(d.getDay()+6)%7;d.setHours(12,0,0,0);d.setDate(d.getDate()-dow);return d} function localDate(d){return d.toISOString().slice(0,10)} function setMeal(k,which,v){db.menu[k]=db.menu[k]||{};db.menu[k][which]=v.trim();save()}
function openMenuPrefs(){modal(`<h2>Preferencias del menú</h2><div class="form"><label>Personas<input id="pPeople" type="number" min="1" value="${Number(db.settings.people)||4}"></label><label>Dieta<input id="pDiet" value="${esc(db.settings.diet||'Sin dieta especial')}" placeholder="Omnívora, vegetariana…"></label><label>Favoritos<input id="pFav" value="${esc(db.settings.fav||'')}" placeholder="Platos o ingredientes favoritos"></label><label>No me gusta / alergias<input id="pNo" value="${esc(db.settings.no||'')}" placeholder="Ingredientes a evitar"></label><label>Tiempo de cocina<input id="pTime" value="${esc(db.settings.time||'30 min')}" placeholder="30 min"></label><label>Presupuesto semanal (opcional)<input id="pBudget" value="${esc(db.settings.budget||'')}" placeholder="Ej. 80 €"></label><label>Comidas y cenas por día<select id="pMeals"><option value="2" ${db.settings.mealsPerDay==2?'selected':''}>Comida + cena</option><option value="1" ${db.settings.mealsPerDay==1?'selected':''}>Solo comida</option></select></label><label>Repetición<select id="pRepeat"><option value="baja" ${db.settings.repeat==='baja'?'selected':''}>Poca repetición</option><option value="media" ${db.settings.repeat==='media'?'selected':''}>Alguna repetición</option><option value="alta" ${db.settings.repeat==='alta'?'selected':''}>No me importa repetir</option></select></label><button class="btn" onclick="savePrefs()">Guardar preferencias</button></div>`)}
function savePrefs(){Object.assign(db.settings,{people:+pPeople.value||4,diet:pDiet.value,fav:pFav.value,no:pNo.value,time:pTime.value,budget:pBudget.value,mealsPerDay:+pMeals.value,repeat:pRepeat.value});closeModal();save()}
function recipeAllowed(r){const no=(db.settings.no||'').toLowerCase().split(/[,;]+/).map(x=>x.trim()).filter(Boolean);return !no.some(n=>r.name.toLowerCase().includes(n)||r.lunch.join(' ').toLowerCase().includes(n)||r.dinner.join(' ').toLowerCase().includes(n))}
function chooseRecipe(used){let options=recipes.filter(recipeAllowed);if(db.settings.repeat==='baja')options=options.filter(r=>!used.has(r.name));if(!options.length)options=recipes.filter(recipeAllowed);return options[Math.floor(Math.random()*options.length)]||recipes[0]}
function generateMenu(){const monday=getMonday(),used=new Set();for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const k=localDate(d);const r=chooseRecipe(used);used.add(r.name);db.menu[k]={lunch:r.name,dinner:r.dinner.join(' + ')} }save();alert('Menú semanal creado con comida y cena para los 7 días.')}
function menuFromPantry(){const have=db.inventory.flatMap(x=>[x.name.toLowerCase(),...(x.aliases||[])].filter(Boolean));if(!have.length)return alert('Añade productos en Casa → Inventario para poder planificar con lo que ya tienes.');const matches=recipes.map(r=>({r,score:[...r.lunch,...r.dinner].filter(i=>have.some(h=>i.includes(h)||h.includes(i))).length})).sort((a,b)=>b.score-a.score).slice(0,4);modal(`<h2>Plan con lo que ya tienes</h2><div class="notice">He usado tu inventario actual como base. Puedes aceptar las ideas o seguir editando el menú.</div><div class="list" style="margin-top:10px">${matches.map((x,i)=>`<div class="card"><b>${esc(x.r.name)}</b><div class="muted">Coincidencias con tu casa: ${x.score}</div><button class="btn secondary small" style="margin-top:8px" onclick="applyPantryIdea(${i})">Usar esta idea</button></div>`).join('')}</div>`);window.pantryMatches=matches}
function applyPantryIdea(i){const x=window.pantryMatches?.[i];if(!x)return;const monday=getMonday();for(let d=0;d<7;d++){const dt=new Date(monday);dt.setDate(monday.getDate()+d);const k=localDate(dt);if(d===0)db.menu[k]={lunch:x.r.name,dinner:x.r.dinner.join(' + ')} }closeModal();save();go('menu')}
function ingredientsForMenu(){const names=Object.values(db.menu).flatMap(m=>[m.lunch,m.dinner]).filter(Boolean).map(x=>x.toLowerCase());const out=[];for(const r of recipes)if(names.some(n=>n.includes(r.name.toLowerCase())||r.name.toLowerCase().includes(n)))out.push(...r.lunch,...r.dinner);return [...new Set(out)]}
function addMissingFromMenu(){const needed=ingredientsForMenu();const have=db.inventory.map(x=>x.name.toLowerCase());const missing=needed.filter(i=>!have.some(h=>i.includes(h)||h.includes(i)));missing.forEach(n=>{if(!db.shopping.some(x=>x.name.toLowerCase()===n))db.shopping.push({id:uid(),name:n,done:false,source:'menu'})});save();alert(missing.length?missing.length+' ingredientes añadidos a la lista de compra.':'No faltan ingredientes de las recetas reconocidas.')}
function renderShop(){const pending=db.shopping.filter(x=>!x.done).length;document.getElementById('shop').innerHTML=`<div class="section-title"><h2>Lista de compra</h2><button class="btn" onclick="addShop()">＋ Añadir</button></div><div class="card"><b>${pending}</b> productos pendientes <span class="pill">Compartida</span></div><div class="list" style="margin-top:10px">${db.shopping.map(x=>`<div class="card row ${x.done?'done':''}"><label class="checkrow"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShop('${x.id}')"> ${esc(x.name)}</label><button class="btn secondary small" onclick="delShop('${x.id}')">×</button></div>`).join('')||'<div class="card empty">La lista está vacía. Añade productos o ingredientes desde el menú.</div>'}</div>`}
function addShop(){modal(`<h2>Añadir a la compra</h2><div class="form"><input id="sName" placeholder="Producto"><input id="sQty" placeholder="Cantidad"><button class="btn" onclick="saveShop()">Añadir</button></div>`)} function saveShop(){if(!sName.value.trim())return;db.shopping.push({id:uid(),name:sName.value.trim()+(sQty.value?' · '+sQty.value:''),done:false});closeModal();save()} function toggleShop(id){const x=db.shopping.find(a=>a.id===id);if(x){x.done=!x.done;save()}} function delShop(id){db.shopping=db.shopping.filter(x=>x.id!==id);save()}
function renderHouse(){const routines=db.routines.length?db.routines:[{id:'r1',name:'Rutina de mañana',items:['Vestirse','Desayunar','Cepillarse los dientes']},{id:'r2',name:'Cole y mochilas',items:['Preparar mochila','Ropa para mañana']},{id:'r3',name:'Rutina de noche',items:['Recoger','Cepillarse los dientes','Preparar ropa'] }];document.getElementById('house').innerHTML=`<div class="section-title"><h2>Casa</h2><button class="btn" onclick="openTask()">＋ Tarea</button></div><div class="quick"><button onclick="openInventory()"><b>📦</b>Inventario<div class="muted">${db.inventory.length} productos</div></button><button onclick="go('mind')"><b>🧠</b>Vacía la cabeza<div class="muted">Organiza ideas</div></button><button onclick="go('shop')"><b>🛒</b>Lista de compra<div class="muted">${db.shopping.filter(x=>!x.done).length} pendientes</div></button></div><div class="section-title"><h3>Rutinas familiares</h3><button class="btn secondary small" onclick="addRoutine()">＋ Rutina</button></div><div class="list">${routines.map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="muted" style="margin-top:6px">${r.items.map(x=>'• '+esc(x)).join('<br>')}</div></div>`).join('')}</div><div class="section-title"><h3>Inventario de casa</h3><button class="btn secondary small" onclick="openInventory()">Gestionar</button></div><div class="list">${db.inventory.map(x=>`<div class="card row"><div><b>${esc(x.name)}</b><div class="subtle">${esc(x.category||'Despensa')}${x.qty?' · '+esc(x.qty):''}${x.expiry?' · vence '+esc(x.expiry):''}</div></div><button class="btn secondary small" onclick="editInventory('${x.id}')">✎</button></div>`).join('')||'<div class="card empty">Añade lo que tienes en despensa, nevera o congelador.</div>'}</div>`}
function openInventory(){modal(`<h2>Inventario de casa</h2><div class="notice">Estos productos se usan para "Plan con lo que ya tengo" y para detectar lo que falta en el menú.</div><div class="form" style="margin-top:10px"><input id="iName" placeholder="Producto, ej. huevos"><input id="iQty" placeholder="Cantidad, ej. 12"><select id="iCat"><option>Despensa</option><option>Nevera</option><option>Congelador</option><option>Limpieza</option><option>Otros</option></select><input id="iExpiry" type="date"><button class="btn" onclick="saveInventory()">Añadir producto</button></div><div class="list" style="margin-top:12px">${db.inventory.map(x=>`<div class="card row"><span>${esc(x.name)}${x.qty?' · '+esc(x.qty):''}</span><button class="btn danger small" onclick="removeInventory('${x.id}')">Eliminar</button></div>`).join('')||'<div class="empty">Todavía no hay productos.</div>'}</div>`)}
function addInventory(){openInventory()} function saveInventory(){if(!iName.value.trim())return;db.inventory.push({id:uid(),name:iName.value.trim(),qty:iQty.value.trim(),category:iCat.value,expiry:iExpiry.value||''});closeModal();save()} function editInventory(id){const x=db.inventory.find(a=>a.id===id);if(!x)return;modal(`<h2>Editar producto</h2><div class="form"><input id="iName" value="${esc(x.name)}"><input id="iQty" value="${esc(x.qty||'')}"><select id="iCat">${['Despensa','Nevera','Congelador','Limpieza','Otros'].map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('')}</select><input id="iExpiry" type="date" value="${esc(x.expiry||'')}"><button class="btn" onclick="updateInventory('${x.id}')">Guardar</button></div>`)} function updateInventory(id){const x=db.inventory.find(a=>a.id===id);if(x){x.name=iName.value.trim();x.qty=iQty.value.trim();x.category=iCat.value;x.expiry=iExpiry.value}closeModal();save()} function removeInventory(id){db.inventory=db.inventory.filter(x=>x.id!==id);save();openInventory()}
function addRoutine(){modal(`<h2>Nueva rutina</h2><div class="form"><input id="rName" placeholder="Ej. Rutina de colegio"><textarea id="rItems" placeholder="Una acción por línea">Preparar mochila\nRopa\nCepillarse los dientes</textarea><button class="btn" onclick="saveRoutine()">Guardar rutina</button></div>`)} function saveRoutine(){if(!rName.value.trim())return;db.routines.push({id:uid(),name:rName.value.trim(),items:rItems.value.split(/\n+/).map(x=>x.trim()).filter(Boolean)});closeModal();save()}
function renderMind(){const note=db.notes[0]||'';document.getElementById('mind').innerHTML=`<div class="section-title"><h2>Vacía la cabeza 🧠</h2></div><div class="card"><div class="muted">Escribe lo que te ronda por la cabeza. Después conviértelo en tarea, evento o déjalo anotado.</div><textarea id="mindText" style="width:100%;margin-top:10px;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:13px" placeholder="Tengo que…">${esc(note)}</textarea><div class="actions" style="margin-top:9px"><button class="btn" onclick="saveMind()">Guardar</button><button class="btn secondary" onclick="mindToTask()">→ Convertir en tarea</button><button class="btn secondary" onclick="mindToEvent()">📅 Convertir en evento</button></div></div>`} function saveMind(){const v=mindText.value.trim();db.notes=v?[v,...db.notes.slice(1)]:[];save()} function mindToTask(){const t=mindText.value.trim();if(!t)return;db.tasks.push({id:uid(),title:t,date:today(),time:'',area:'Casa',assignee:db.family.members[0]?.id,priority:'normal',repeat:'none',notes:'Desde Vacía la cabeza',done:false});db.notes=[];save();go('tasks')} function mindToEvent(){const t=mindText.value.trim();if(!t)return;db.events.push({id:uid(),title:t,date:today(),time:'',notes:'Desde Vacía la cabeza'});db.notes=[];save();go('calendar')}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="section-title"><h2>Ajustes</h2></div><div class="list"><div class="card"><b>Casa</b><div class="form" style="margin-top:9px"><input value="${esc(db.family.name)}" onchange="db.family.name=this.value;save()"><button class="btn" onclick="requestNotify()">🔔 Activar notificaciones</button></div></div><div class="card"><b>Datos</b><div class="actions" style="margin-top:9px"><button class="btn" onclick="exportData()">Exportar copia</button><label class="btn secondary">Importar<input type="file" accept="application/json" onchange="importData(event)" hidden></label><button class="btn secondary" onclick="syncNow(true)">☁ Sincronizar</button></div></div><div class="card"><b>Ubicación y tiempo</b><div class="actions" style="margin-top:9px"><button class="btn" onclick="setCity()">📍 Elegir ciudad</button><button class="btn secondary" onclick="useLocation()">Usar ubicación</button></div></div><div class="card"><b>Sobre "Detalles" del tiempo</b><div class="muted">Muestra/oculta la previsión ampliada. El tiempo es informativo y nunca cambia tareas automáticamente.</div></div></div>`}
function openMore(){modal(`<h2>Casa en Calma</h2><div class="more-sheet"><button onclick="closeModal();go('calendar')"><b>📅 Agenda</b><span class="muted">Eventos familiares</span></button><button onclick="closeModal();go('shop')"><b>🛒 Lista de compra</b><span class="muted">Lista compartida</span></button><button onclick="closeModal();go('house')"><b>🏡 Casa</b><span class="muted">Rutinas e inventario</span></button><button onclick="closeModal();go('mind')"><b>🧠 Vacía la cabeza</b><span class="muted">Notas y organización</span></button><button onclick="closeModal();go('settings')"><b>⚙ Ajustes</b><span class="muted">Datos, avisos y tiempo</span></button><button onclick="closeModal();go('tasks')"><b>✓ Tareas</b><span class="muted">Todas las tareas</span></button></div>`)}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')} function closeModal(){document.getElementById('modal').classList.remove('show')}
function notify(title,body){if(db.settings.notify&&'Notification'in window&&Notification.permission==='granted')try{new Notification(title,{body})}catch{}}
async function requestNotify(){if(!('Notification'in window))return alert('Este navegador no permite notificaciones');const p=await Notification.requestPermission();db.settings.notify=p==='granted';save();alert(p==='granted'?'Notificaciones activadas':'No se han activado')}
function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='casa-en-calma-copia.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=mergeDB(JSON.parse(r.result));save();alert('Copia restaurada')}catch{alert('Archivo no válido')}};r.readAsText(f)}
async function setCity(){const c=prompt('Escribe tu ciudad (ej. Oviedo)');if(!c)return;db.weather.city=c;db.weather.lat=null;db.weather.lon=null;save(true);await fetchWeather()}
async function useLocation(){if(!navigator.geolocation)return alert('Tu navegador no permite ubicación');navigator.geolocation.getCurrentPosition(async p=>{db.weather.lat=p.coords.latitude;db.weather.lon=p.coords.longitude;db.weather.city='Ubicación actual';save(true);await fetchWeather()},()=>alert('No se pudo obtener la ubicación'))}
async function fetchWeather(){try{let lat=db.weather.lat,lon=db.weather.lon;if(!lat){const q=encodeURIComponent(db.weather.city||'Oviedo, Spain');const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+q+'&count=1&language=es&format=json');const j=await g.json();if(!j.results?.[0])throw new Error('Ciudad no encontrada');lat=j.results[0].latitude;lon=j.results[0].longitude}const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto`);if(!w.ok)throw new Error('Tiempo no disponible');db.weather.data=await w.json();save(true);updateWeatherUI()}catch(e){console.warn('weather',e)}}
function weatherTextFor(code){if(code===0)return['☀️','Despejado'];if(code<4)return['🌤️','Parcialmente nublado'];if(code<60)return['☁️','Nublado'];if(code<70)return['🌧️','Lluvia'];if(code<80)return['❄️','Nieve'];return['🌦️','Tiempo variable']}
function updateWeatherUI(){const w=db.weather.data;if(!w)return;const [icon,text]=weatherTextFor(w.current.weather_code);document.getElementById('weatherIcon').textContent=icon;document.getElementById('temp').textContent=Math.round(w.current.temperature_2m)+'°';document.getElementById('weatherText').textContent=text+' · Máx. '+Math.round(w.daily.temperature_2m_max[0])+'° · Mín. '+Math.round(w.daily.temperature_2m_min[0])+'°';document.getElementById('weatherDetail').innerHTML=`<b>${esc(db.weather.city||'Tu ubicación')}</b><div class="subtle">${text}</div><div class="grid" style="margin-top:8px"><div class="card"><b>Ahora</b><div>${Math.round(w.current.temperature_2m)}°</div></div><div class="card"><b>Humedad</b><div>${Math.round(w.current.relative_humidity_2m||0)}%</div></div><div class="card"><b>Máxima</b><div>${Math.round(w.daily.temperature_2m_max[0])}°</div></div><div class="card"><b>Mínima</b><div>${Math.round(w.daily.temperature_2m_min[0])}°</div></div></div><div class="subtle" style="margin-top:8px">El tiempo solo te informa: no modifica tareas ni rutinas por su cuenta.</div>`}
function toggleWeatherDetails(){const el=document.getElementById('weatherDetail');if(!db.weather.data){setCity();return}el.classList.toggle('show')}
let syncTimer;function syncDebounced(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),900)}
async function syncNow(show){if(!db.family.code){if(show)alert('Primero crea o introduce un código familiar.');return false}try{const url='/.netlify/functions/sync?code='+encodeURIComponent(db.family.code);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);const remote=await r.json();const localStamp=Number(localStorage.getItem(KEY+'-stamp')||0);if(remote?.data&&(remote.stamp||0)>localStamp){db=mergeDB(remote.data);localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(KEY+'-stamp',String(remote.stamp||Date.now()));render()}const stamp=Date.now();const p=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data:db,stamp})});if(!p.ok)throw new Error('POST '+p.status);localStorage.setItem(KEY+'-stamp',String(stamp));if(show)alert('Sincronización correcta.');return true}catch(e){console.warn('sync',e);if(show)alert('No se pudo sincronizar todavía. Comprueba que la función sync de Netlify esté desplegada en este sitio.');return false}}
fetchWeather();render();if(db.family.code)setTimeout(()=>syncNow(false),1200);setInterval(()=>{if(db.family.code)syncNow(false)},20000);document.querySelector('[data-view="today"]').classList.add('active');
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e)))}</script></body></html>
